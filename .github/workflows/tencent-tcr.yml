name: Build Outline image for Tencent TCR

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: outline-tcr-build-${{ github.ref }}
  cancel-in-progress: false

env:
  TCR_REGISTRY: outline-prod-tcr.tencentcloudcr.com
  TCR_IMAGE: outline-prod-tcr.tencentcloudcr.com/outline/outline

jobs:
  build:
    name: Build and push linux/amd64 image
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to Tencent TCR with CI service account
        shell: bash
        env:
          TCR_PUSH_USERNAME: ${{ secrets.TCR_PUSH_USERNAME }}
          TCR_PUSH_PASSWORD: ${{ secrets.TCR_PUSH_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${TCR_PUSH_USERNAME}" ] || [ -z "${TCR_PUSH_PASSWORD}" ]; then
            echo "TCR_PUSH_USERNAME and TCR_PUSH_PASSWORD GitHub secrets are required" >&2
            exit 1
          fi

          for attempt in 1 2 3 4 5; do
            if printf '%s' "${TCR_PUSH_PASSWORD}" | docker login "${TCR_REGISTRY}" --username "${TCR_PUSH_USERNAME}" --password-stdin; then
              exit 0
            fi

            if [ "${attempt}" -eq 5 ]; then
              exit 1
            fi

            echo "TCR login attempt ${attempt} failed; retrying in 15 seconds" >&2
            sleep 15
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Build and push source build image
        id: base_first
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          platforms: linux/amd64
          push: true
          pull: true
          tags: ${{ env.TCR_IMAGE }}:base-${{ github.sha }}

      - name: Retry source build image push
        id: base_retry
        if: steps.base_first.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          platforms: linux/amd64
          push: true
          pull: true
          tags: ${{ env.TCR_IMAGE }}:base-${{ github.sha }}

      - name: Require source build image
        if: steps.base_first.outcome == 'failure' && steps.base_retry.outcome == 'failure'
        shell: bash
        run: exit 1

      - name: Build and push Outline runtime image
        id: runtime_first
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          pull: true
          build-args: |
            BASE_IMAGE=${{ env.TCR_IMAGE }}@${{ steps.base_retry.outputs.digest || steps.base_first.outputs.digest }}
          labels: |
            org.opencontainers.image.source=https://github.com/primatrix/outline
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ env.TCR_IMAGE }}:git-${{ github.sha }}

      - name: Retry Outline runtime image push
        id: runtime_retry
        if: steps.runtime_first.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          pull: true
          build-args: |
            BASE_IMAGE=${{ env.TCR_IMAGE }}@${{ steps.base_retry.outputs.digest || steps.base_first.outputs.digest }}
          labels: |
            org.opencontainers.image.source=https://github.com/primatrix/outline
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ env.TCR_IMAGE }}:git-${{ github.sha }}

      - name: Require Outline runtime image
        if: steps.runtime_first.outcome == 'failure' && steps.runtime_retry.outcome == 'failure'
        shell: bash
        run: exit 1

      - name: Publish image digest
        shell: bash
        run: |
          {
            echo "## Tencent TCR image"
            echo
            echo "\`${TCR_IMAGE}@${{ steps.runtime_retry.outputs.digest || steps.runtime_first.outputs.digest }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
